name: MediaHub
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MediaHub:
    type: application
    platform: iOS
    sources: [MediaHub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaHub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
